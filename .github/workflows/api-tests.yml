name: ShareIt API Tests

on:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Start Services (Docker Compose)
        run: docker-compose up -d

      - name: Wait for Server Ready
        run: |
          echo "Waiting for Spring Boot to start..."
          timeout 60s bash -c 'until curl -s localhost:8080/users; do sleep 2; echo "Still waiting for localhost:8080..."; done' || (docker-compose logs && exit 1)

      - name: Install Newman
        run: npm install -g newman

      - name: Run Newman Tests
        run: newman run ./tests/postman/sprint.json --delay-request 50

      - name: Stop Services
        if: always()
        run: docker-compose down